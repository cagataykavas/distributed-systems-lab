[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-systems-resilience"
version = "0.3.0"
description = "Executable resilience simulations for retries, circuit breakers, idempotency, DLQs, bulkheads and backpressure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
resilience-lab = "resilience.cli:main"

[tool.setuptools]
py-modules = ["reliability", "idempotency", "bulkhead", "backpressure", "dead_letter_queue"]

[tool.setuptools.packages.find]
include = ["resilience*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
